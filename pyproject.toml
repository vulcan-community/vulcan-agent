[project]
name = "vulcan-agent"
version = "0.1.0"
description = "Vulcan Agent: A versatile agent framework for multi-agent collaboration and task execution."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.136.1",
    "litellm[proxy]>=1.83.0",
    "loguru>=0.7.3",
    "openai>=2.33.0",
    "typer>=0.25.0",
]

[project.optional-dependencies]
claude-code = ["claude-agent-sdk>=0.1.72"]
feishu = [
    "lark-oapi>=1.5.5",
]

[project.scripts]
vulcan = "vulcan.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vulcan"]

[dependency-groups]
dev = [
    "pyright>=1.1.409",
]

[tool.pyright]
include = ["vulcan", "samples"]
exclude = ["**/__pycache__", ".venv", "docs"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
pythonVersion = "3.12"
